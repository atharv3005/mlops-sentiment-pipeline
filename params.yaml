data_prep:
  test_size: 0.2
  random_state: 42

train:
  max_features: 2000
  ngram_range_min: 1
  ngram_range_max: 2
  C: 1.0
  max_iter: 1000
  random_state: 42
  min_accuracy_threshold: 0.70   # CI fails the build below this

drift:
  text_length_ks_pvalue_threshold: 0.05   # below this => distribution shift flagged
  class_balance_psi_threshold: 0.2        # above this => population shift flagged
  min_predictions_for_check: 20           # don't judge drift on tiny samples
