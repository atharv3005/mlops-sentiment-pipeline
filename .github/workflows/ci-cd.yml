name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/sentiment-api

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data
        run: python src/data_prep.py

      - name: Train model (fails build if accuracy < threshold)
        run: python src/train.py

      - name: Run unit + API tests
        run: pytest tests/ -v

      # Model + vectorizer are needed by the docker-build job below
      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/

  docker-build-and-push:
    needs: test-and-train
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # Optional: point this at your host's deploy hook (Render/Railway/Fly.io
      # all support a simple webhook-triggered redeploy on new image push).
      # - name: Trigger deploy
      #   run: curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"
